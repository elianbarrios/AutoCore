services:
  db:
    image: postgres:18
    container_name: autocore-db
    restart: on-failure
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - autocore_data:/var/lib/postgresql/18/docker
volumes:
  autocore_data:
